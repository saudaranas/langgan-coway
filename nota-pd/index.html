<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal Belajar Team PD</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#163a5c;--ink:#14212b;--muted:#55636e;--line:#dbe2e7;--panel:#f3f6f8;--blue:#1c7ab8;--orange:#e08a1e}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;color:var(--ink);background:var(--panel)}
.hero{background:var(--navy);color:#fff;padding:28px 16px 24px}
.wrap{max-width:900px;margin:0 auto}
.tag{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#9fd0f3}
.hero h1{font-size:26px;line-height:1.2;margin:6px 0 8px}
.hero p{color:#c3d3e2;margin:0}
main{padding:16px 14px 40px}
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.count{font-size:14px;color:var(--muted);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.cover{text-decoration:none;aspect-ratio:3/4;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative}
.cover .k{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;opacity:.85}
.cover .t{font-size:16px;font-weight:700;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cover .pdf{align-self:flex-start;font-size:11px;font-weight:700;background:rgba(255,255,255,.2);border-radius:4px;padding:2px 7px}
.new{position:absolute;top:10px;right:10px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 6px}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.info .meta{font-size:12.5px;color:var(--muted)}
.dl{margin-top:auto;display:block;text-align:center;text-decoration:none;font-weight:600;font-size:14px;border-radius:8px;padding:8px;background:#fff7ec;color:#9a5a0c;border:1px solid #f3d3a8}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 10px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 20px 30px}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="tag">Team PD · Coway</div>
  <h1>Portal Belajar Team PD</h1>
  <p>Koleksi nota training, skrip dan panduan jualan dalam bentuk PDF. Tekan kad untuk buka.</p>
</div></header>

<main class="wrap">
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Cari nota, contohnya closing, VPC, rejection">
    <div class="chips" id="chips"></div>
  </div>
  <p class="count" id="count"></p>
  <div class="grid" id="list"></div>
</main>
<footer>Untuk kegunaan Team PD sahaja · Jangan kongsi di luar team</footer>

<script>
/* ============================================================
   SENARAI NOTA
   Nak tambah nota baru:
   1. Buat folder baru dalam /nota-pd/ (contoh: /nota-pd/skrip-closing/)
      dan letak fail PDF di dalamnya (index.html versi web adalah pilihan).
   2. Tambah satu objek di BAHAGIAN ATAS senarai ini (nota terbaru di atas).
   ============================================================ */
const NOTA = [
  {
    tajuk: "The Ultimate Sales Framework",
    kategori: "Sales Training",
    tarikh: "2026-11-16",
    sumber: "EC Team Academy · Wangsa Maju, KL",
    ringkasan: "Sales Process, Value Proposition Canvas, Sales Funnel R-E-A → BO → CTA, 5 tahap awareness, closing, handle rejection dan skrip call lead eTrust.",
    topik: ["Sales Process", "VPC", "Sales Funnel", "Awareness", "Closing", "Rejection", "Skrip eTrust"],
    mukaSurat: 9,
    pdf: "ultimate-sales-framework/nota-ultimate-sales-framework.pdf",
    web: "ultimate-sales-framework/",   // pilihan: versi web untuk baca di telefon
    gambar: "ultimate-sales-framework/cover.jpg"   // pilihan: gambar kulit 3:4 (jika tiada, guna warna)
  }
];

const WARNA = ["#163a5c","#1c7ab8","#2f855a","#8e44ad","#c0392b","#e08a1e"];
const BULAN = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
const fmt = d => { const [y,m,dd] = d.split("-"); return +dd + " " + BULAN[+m-1] + " " + y; };
const isNew = d => (Date.now() - new Date(d)) / 864e5 <= 14;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let kat = "Semua";
const cats = ["Semua", ...new Set(NOTA.map(n => n.kategori))];
const chips = document.getElementById("chips");
chips.innerHTML = cats.map(c => `<button class="chip${c===kat?" on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
chips.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  kat = b.dataset.c;
  chips.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
  render();
});
document.getElementById("q").addEventListener("input", render);

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const rows = NOTA
    .filter(n => kat === "Semua" || n.kategori === kat)
    .filter(n => !q || [n.tajuk, n.kategori, n.ringkasan, n.sumber, ...n.topik].join(" ").toLowerCase().includes(q))
    .sort((a,b) => b.tarikh.localeCompare(a.tarikh));
  document.getElementById("count").textContent = rows.length + " nota";
  document.getElementById("list").innerHTML = rows.length ? rows.map((n,i) => `
    <div class="card">
      <a href="${esc(n.pdf)}" target="_blank" rel="noopener" class="cover" style="background-color:${n.warna || WARNA[NOTA.indexOf(n) % WARNA.length]}${n.gambar ? `;background-image:linear-gradient(180deg,rgba(0,0,0,.05) 35%,rgba(0,0,0,.78)),url('${esc(n.gambar)}');background-size:cover;background-position:center` : ''}">
        ${isNew(n.tarikh) ? '<span class="new">BARU</span>' : ''}
        <span class="pdf">PDF</span>
        <div><div class="k">${esc(n.kategori)}</div><div class="t">${esc(n.tajuk)}</div></div>
      </a>
      <div class="info">
        <div class="meta">${fmt(n.tarikh)}${n.mukaSurat ? ' · ' + n.mukaSurat + ' m/s' : ''}</div>
        <a class="dl" href="${esc(n.pdf)}" download>⬇ Muat turun</a>
      </div>
    </div>`).join("") : '<div class="empty">Tiada nota dijumpai.</div>';
}
render();
</script>
</body>
</html>
