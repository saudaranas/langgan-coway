<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal Belajar Team PD</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#163a5c;--ink:#14212b;--muted:#55636e;--line:#dbe2e7;--panel:#f3f6f8;--blue:#1c7ab8;--orange:#e08a1e}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.55;color:var(--ink);background:var(--panel)}
.hero{background:var(--navy);color:#fff;padding:30px 20px 26px}
.wrap{max-width:760px;margin:0 auto}
.tag{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#9fd0f3}
.hero h1{font-size:27px;line-height:1.2;margin:6px 0 8px}
.hero p{color:#c3d3e2;margin:0}
main{padding:18px 16px 40px}
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.count{font-size:14px;color:var(--muted);margin:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card .cat{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--blue)}
.card h2{font-size:18px;line-height:1.3;margin:2px 0 4px;color:var(--navy)}
.card .meta{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.card .desc{margin:0 0 10px;font-size:15px}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.topics span{font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.actions{display:flex;gap:8px}
.btn{flex:1;text-align:center;text-decoration:none;font-weight:600;font-size:15px;border-radius:8px;padding:10px 12px}
.btn.read{background:var(--navy);color:#fff}
.btn.pdf{background:#fff7ec;color:#9a5a0c;border:1px solid #f3d3a8}
.new{display:inline-block;background:var(--orange);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.head{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.ico{flex:none;width:44px;height:54px;border-radius:6px;background:#c0392b;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;position:relative}
.ico::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 12px 12px 0;border-color:transparent var(--panel) #e57367 transparent}
.web{display:block;margin-top:10px;font-size:14px;color:var(--blue);text-decoration:none;text-align:center}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 20px 30px}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="tag">Team PD · Coway</div>
  <h1>Portal Belajar Team PD</h1>
  <p>Nota training, skrip dan panduan jualan untuk team dalam bentuk PDF.</p>
</div></header>

<main class="wrap">
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Cari nota, contohnya closing, VPC, rejection">
    <div class="chips" id="chips"></div>
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>
<footer>Untuk kegunaan Team PD sahaja · Jangan kongsi di luar team</footer>

<script>
/* ============================================================
   SENARAI NOTA
   Nak tambah nota baru:
   1. Buat folder baru dalam /nota-pd/ (contoh: /nota-pd/skrip-closing/)
      dan letak fail PDF di dalamnya (index.html versi web adalah pilihan).
   2. Tambah satu objek di BAHAGIAN ATAS senarai ini (nota terbaru di atas).
   ============================================================ */
const NOTA = [
  {
    tajuk: "The Ultimate Sales Framework",
    kategori: "Sales Training",
    tarikh: "2026-11-16",
    sumber: "EC Team Academy · Wangsa Maju, KL",
    ringkasan: "Sales Process, Value Proposition Canvas, Sales Funnel R-E-A → BO → CTA, 5 tahap awareness, closing, handle rejection dan skrip call lead eTrust.",
    topik: ["Sales Process", "VPC", "Sales Funnel", "Awareness", "Closing", "Rejection", "Skrip eTrust"],
    mukaSurat: 9,
    pdf: "ultimate-sales-framework/nota-ultimate-sales-framework.pdf",
    web: "ultimate-sales-framework/"   // pilihan: versi web untuk baca di telefon
  }
];

const BULAN = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
const fmt = d => { const [y,m,dd] = d.split("-"); return +dd + " " + BULAN[+m-1] + " " + y; };
const isNew = d => (Date.now() - new Date(d)) / 864e5 <= 14;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let kat = "Semua";
const cats = ["Semua", ...new Set(NOTA.map(n => n.kategori))];
const chips = document.getElementById("chips");
chips.innerHTML = cats.map(c => `<button class="chip${c===kat?" on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
chips.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  kat = b.dataset.c;
  chips.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
  render();
});
document.getElementById("q").addEventListener("input", render);

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const rows = NOTA
    .filter(n => kat === "Semua" || n.kategori === kat)
    .filter(n => !q || [n.tajuk, n.kategori, n.ringkasan, n.sumber, ...n.topik].join(" ").toLowerCase().includes(q))
    .sort((a,b) => b.tarikh.localeCompare(a.tarikh));
  document.getElementById("count").textContent = rows.length + " nota";
  document.getElementById("list").innerHTML = rows.length ? rows.map(n => `
    <article class="card">
      <div class="head">
        <div class="ico">PDF</div>
        <div>
          <div class="cat">${esc(n.kategori)}</div>
          <h2>${esc(n.tajuk)}${isNew(n.tarikh) ? '<span class="new">BARU</span>' : ''}</h2>
          <div class="meta">${fmt(n.tarikh)}${n.mukaSurat ? ' · ' + n.mukaSurat + ' muka surat' : ''}<br>${esc(n.sumber)}</div>
        </div>
      </div>
      <p class="desc">${esc(n.ringkasan)}</p>
      <div class="topics">${n.topik.map(t => `<span>${esc(t)}</span>`).join("")}</div>
      <div class="actions">
        <a class="btn read" href="${esc(n.pdf)}" target="_blank" rel="noopener">Buka PDF</a>
        <a class="btn pdf" href="${esc(n.pdf)}" download>⬇ Muat turun</a>
      </div>
      ${n.web ? `<a class="web" href="${esc(n.web)}">Atau baca versi web →</a>` : ""}
    </article>`).join("") : '<div class="empty">Tiada nota dijumpai.</div>';
}
render();
</script>
</body>
</html>
