<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hikayat Pahlawan Rezeki · Jeti Melaka</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14182e">
<link rel="icon" href="/img/coway-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--malam:#14182e;--emas:#f1c24b;--kertas:#fbf1d9;--dakwat:#2a1f14;--merah:#b43a3a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0d1022;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{font-family:"Pixelify Sans",ui-monospace,monospace;color:var(--kertas)}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;display:block}
  button{font:inherit;cursor:pointer}
  [hidden]{display:none!important}

  /* HUD */
  .hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 10px 0;pointer-events:none;z-index:5}
  .misi{background:rgba(20,24,46,.82);border:2px solid #3b4170;border-radius:10px;padding:7px 11px;max-width:70vw;pointer-events:auto}
  .misi small{display:block;color:var(--emas);font-size:12px;letter-spacing:.5px}
  .misi b{display:block;font-size:15px;font-weight:400;line-height:1.3}
  .ikon{display:flex;gap:6px;pointer-events:auto}
  .ikon button,.ikon a{width:42px;height:42px;border-radius:10px;border:2px solid #3b4170;background:rgba(20,24,46,.82);color:var(--kertas);font-size:19px;display:flex;align-items:center;justify-content:center;text-decoration:none}

  /* kawalan sentuh */
  .kayu{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);transform:translate(-50%,-50%);z-index:4;pointer-events:none}
  .kayu i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.35)}
  .btnA{position:fixed;right:calc(22px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;border:3px solid #7a2a2a;background:var(--merah);color:#fff;font-size:26px;z-index:5;box-shadow:0 5px 0 #6b2020;transition:transform .08s}
  .btnA.dekat{animation:denyut 1s infinite}
  .btnA:active{transform:translateY(4px);box-shadow:0 1px 0 #6b2020}
  .btnA small{display:block;font-size:11px;margin-top:-4px}
  @keyframes denyut{50%{box-shadow:0 5px 0 #6b2020,0 0 0 8px rgba(241,194,75,.45)}}
  .tip{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,24,46,.9);border:2px solid #3b4170;border-radius:10px;padding:8px 14px;font-size:14px;z-index:6;text-align:center;max-width:86vw;transition:opacity .4s}

  /* dialog */
  .dialog{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,calc(100vw - 20px));background:var(--kertas);color:var(--dakwat);border:4px solid #5a3b22;border-radius:14px;box-shadow:0 0 0 3px #e6c78f inset,0 10px 30px rgba(0,0,0,.45);padding:14px 16px 14px;display:flex;gap:12px;z-index:8;min-height:120px}
  .dialog .muka{width:76px;height:76px;flex:none;border-radius:10px;background:#e9d6ac;border:3px solid #5a3b22;image-rendering:pixelated;object-fit:cover}
  .dialog .isi{flex:1;min-width:0}
  .dialog .nama{color:var(--merah);font-size:15px;margin-bottom:4px}
  .dialog .teks{font-size:17px;line-height:1.45;min-height:50px;white-space:pre-wrap}
  .dialog .lagi{position:absolute;right:16px;bottom:8px;font-size:14px;animation:lompat .7s infinite}
  @keyframes lompat{50%{transform:translateY(-4px)}}
  .pilihan{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .pilihan button{background:#fff8e6;border:3px solid #5a3b22;border-radius:10px;padding:10px 12px;color:var(--dakwat);font-size:16px;text-align:left}
  .pilihan button:hover,.pilihan button:focus-visible{background:var(--emas);outline:none}

  /* skrin judul, naratif, gulungan */
  .tirai{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .judul{background:radial-gradient(ellipse at 50% 30%,rgba(44,52,102,.92),rgba(13,16,34,.97) 70%)}
  .judul .keris{font-size:52px;animation:apung 3s ease-in-out infinite}
  @keyframes apung{50%{transform:translateY(-8px) rotate(-4deg)}}
  .judul h1{font-weight:400;font-size:clamp(32px,9vw,54px);line-height:1.05;margin:10px 0 6px;color:var(--emas);text-shadow:0 4px 0 #6b3f12}
  .judul p{color:#cfc6b4;max-width:420px;font-size:15px;line-height:1.5;margin:0 0 22px}
  .pilihW{display:flex;gap:12px;margin-bottom:20px}
  .pilihW button{width:120px;padding:12px 6px;border-radius:12px;border:3px solid #3b4170;background:rgba(255,255,255,.06);color:var(--kertas);font-size:15px}
  .pilihW button[aria-pressed="true"]{border-color:var(--emas);background:rgba(241,194,75,.15)}
  .pilihW canvas{position:static;width:64px;height:64px;display:block;margin:0 auto 6px}
  .mula{background:var(--emas);color:var(--malam);border:0;border-radius:12px;padding:15px 34px;font-size:19px;box-shadow:0 5px 0 #8a6416}
  .mula:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6416}
  .kecil{font-size:12px;color:#8f8aa6;margin-top:18px}
  .naratif{background:#fff;color:#2a1f14;transition:background 1.2s}
  .naratif.gelap{background:#0d1022;color:var(--kertas)}
  .naratif p{font-size:clamp(18px,5vw,26px);line-height:1.5;max-width:560px;margin:0;opacity:0;transition:opacity .8s}
  .naratif p.nampak{opacity:1}
  .naratif small{position:absolute;bottom:30px;font-size:13px;opacity:.6}
  .gulung{background:rgba(10,12,28,.8)}
  .kertasG{background:var(--kertas);color:var(--dakwat);border:4px solid #5a3b22;border-radius:14px;max-width:460px;width:100%;padding:22px 20px;text-align:left;max-height:86vh;overflow:auto;animation:buka .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes buka{from{transform:scale(.6) rotate(-3deg);opacity:0}}
  .kertasG h2{font-weight:400;font-size:24px;margin:0 0 4px;color:var(--merah);text-align:center}
  .kertasG .sub{text-align:center;font-size:13px;color:#7a6a55;margin-bottom:12px}
  .kertasG ul{padding-left:20px;margin:0 0 14px;font-size:15px;line-height:1.5;font-family:system-ui,sans-serif}
  .kertasG li{margin-bottom:7px}
  .kertasG .pesan{background:#f3e2bd;border-left:5px solid var(--merah);padding:10px 12px;border-radius:6px;font-size:15px;line-height:1.5;margin-bottom:14px}
  .kertasG button{width:100%}
  .pudar{position:fixed;inset:0;background:#000;z-index:9;pointer-events:none;opacity:0;transition:opacity .5s}
</style>
</head>
<body>
<canvas id="c" aria-label="Dunia permainan Jeti Melaka"></canvas>

<div class="hud" id="hud" hidden>
  <div class="misi" aria-live="polite"><small id="mBab">BAB 1 · SURAT CAP MOHOR</small><b id="mTeks">Cari Tok Malik</b></div>
  <div class="ikon">
    <button type="button" id="bunyi" aria-label="Bunyi">🔊</button>
    <a href="/hikayat/" aria-label="Peta ujian">📜</a>
  </div>
</div>
<div class="kayu" id="kayu" hidden><i id="kayuI"></i></div>
<button type="button" class="btnA" id="btnA" hidden aria-label="Berbual atau ambil">A<small>BUAL</small></button>
<div class="tip" id="tip" hidden></div>

<div class="dialog" id="dialog" hidden role="dialog" aria-live="polite">
  <img class="muka" id="dMuka" alt="">
  <div class="isi">
    <div class="nama" id="dNama"></div>
    <div class="teks" id="dTeks"></div>
    <div class="pilihan" id="dPilih" hidden></div>
  </div>
  <span class="lagi" id="dLagi" aria-hidden="true">▼</span>
</div>

<section class="tirai judul" id="sJudul">
  <div class="keris" aria-hidden="true">🗡️</div>
  <h1>Hikayat<br>Pahlawan Rezeki</h1>
  <p>Sebilah keris lama membawa anda ke Melaka kurun ke-15. Lulus sembilan ujian pedagang, dan pulang dengan ilmu untuk mengubah nasib.</p>
  <div class="pilihW" id="pilihW" role="group" aria-label="Pilih watak">
    <button type="button" data-w="L" aria-pressed="false"><canvas width="16" height="16" data-s="Villager3"></canvas>Hafiz</button>
    <button type="button" data-w="P" aria-pressed="false"><canvas width="16" height="16" data-s="OldWoman"></canvas>Aisyah</button>
  </div>
  <button type="button" class="mula" id="mula">▶ Mula</button>
  <div class="kecil">🎧 Lebih seronok dengan bunyi</div>
</section>

<section class="tirai naratif" id="sNaratif" hidden aria-live="polite">
  <p id="nTeks"></p>
  <small>Ketik untuk teruskan</small>
</section>

<section class="tirai gulung" id="sGulung" hidden role="dialog" aria-modal="true" aria-labelledby="gJudul">
  <div class="kertasG">
    <h2 id="gJudul">📜 Gulungan Ilmu</h2>
    <div class="sub">Ilmu Tok Malik · Bab 1</div>
    <ul id="gIlmu"></ul>
    <div class="pesan" id="gPesan"></div>
    <button type="button" class="mula" id="gTutup">Simpan dalam beg</button>
  </div>
</section>
<div class="pudar" id="pudar"></div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const LS = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Simpanan ---------- */
const S = Object.assign({ jumpaTok:0, gulungan:0, lapor:0, sampai:0 }, JSON.parse(LS.get("hk_dunia") || "{}"));
const simpan = () => LS.set("hk_dunia", JSON.stringify(S));
let WATAK = LS.get("hk_w") || "";
const NAMA = () => WATAK === "P" ? "Aisyah" : "Hafiz";
const PANGGIL = () => WATAK === "P" ? "Kakak" : "Abang";

/* ---------- Aset ---------- */
const IMG = {};
const muat = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.onerror = r; i.src = src; });
const WATAKS = ["Villager3","OldWoman","Monk","OldMan2","Child","Woman","Samurai","Sultan2"];
let PETA = null;

/* ---------- Bunyi ---------- */
let AC = null, BUNYI = LS.get("hk_bunyi") !== "0";
const BUF = {};
const lagu = new Audio("aset/audio/kampung.mp3"); lagu.loop = true; lagu.volume = .45;
const laguJ = new Audio("aset/audio/judul.mp3"); laguJ.loop = true; laguJ.volume = .5;
const ombak = new Audio("aset/audio/ombak.mp3"); ombak.loop = true; ombak.volume = 0;
function bukaAudio(){
  if(AC) return;
  try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
  ["pilih","gerak","batal","gulungan","syiling","seru","lulus","rahsia","langkah"].forEach(n =>
    fetch("aset/audio/" + n + ".mp3").then(r => r.arrayBuffer()).then(b => AC.decodeAudioData(b, d => BUF[n] = d, () => {})).catch(() => {}));
}
function sfx(n, vol){
  if(!BUNYI || !AC || !BUF[n]) return;
  const s = AC.createBufferSource(), g = AC.createGain(); g.gain.value = vol == null ? .7 : vol;
  s.buffer = BUF[n]; s.connect(g).connect(AC.destination); s.start();
}
function blip(pitch){
  if(!BUNYI || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = "square"; o.frequency.value = pitch * (0.94 + Math.random() * .12);
  g.gain.setValueAtTime(.045, t); g.gain.exponentialRampToValueAtTime(.0001, t + .06);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .07);
}
function mainLagu(a){
  [lagu, laguJ, ombak].forEach(x => { if(x !== a && x !== ombak) x.pause(); });
  if(BUNYI){ a.play().catch(() => {}); if(a === lagu) ombak.play().catch(() => {}); }
}
function setBunyi(on){
  BUNYI = on; LS.set("hk_bunyi", on ? "1" : "0"); $("bunyi").textContent = on ? "🔊" : "🔇";
  if(!on){ lagu.pause(); laguJ.pause(); ombak.pause(); }
  else if(main) mainLagu(lagu);
}
$("bunyi").onclick = () => { setBunyi(!BUNYI); sfx("pilih"); };

/* ---------- Kanvas ---------- */
const cv = $("c"), ctx = cv.getContext("2d");
let SK = 3, VW = 0, VH = 0, DPR = 1;
function saiz(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  SK = Math.max(2, Math.min(4.5, Math.min(w / (16 * 10), h / (16 * 9))));
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  VW = w / SK; VH = h / SK;
}
addEventListener("resize", saiz); saiz();

/* ---------- Dunia ---------- */
const T = 16;
const halang = (tx, ty) => !PETA || tx < 0 || ty < 0 || tx >= PETA.w || ty >= PETA.h || PETA.halang[ty][tx] === "1";
const pada = (x, y) => halang(Math.floor(x / T), Math.floor(y / T));
const ARAH = { bawah:0, atas:1, kiri:2, kanan:3 };

function Watak(o){ return Object.assign({ x:0, y:0, arah:"bawah", jalan:0, fr:0, laju:64, rumah:null, seru:false, nada:300 }, o); }
const pemain = Watak({ nama:"", laju:72 });
const tile = (tx, ty) => ({ x: tx * T + 8, y: ty * T + 14 });

const NPC = [
  Watak(Object.assign(tile(14, 15), { id:"tok", nama:"Tok Malik", s:"Monk", muka:"Monk", nada:150, arah:"bawah" })),
  Watak(Object.assign(tile(17, 24), { id:"nelayan", nama:"Pak Mat Nelayan", s:"OldMan2", muka:"OldMan2", nada:190, arah:"kanan" })),
  Watak(Object.assign(tile(20, 14), { id:"budak", nama:"Awang Kecil", s:"Child", muka:"Child", nada:520, kelana:28 })),
  Watak(Object.assign(tile(22, 10), { id:"makcik", nama:"Mak Cik Senah", s:"Woman", muka:"Woman", nada:380, kelana:24 })),
  Watak(Object.assign(tile(33, 11), { id:"pengawal", nama:"Pengawal Pasar", s:"Samurai", muka:"Samurai", nada:170, arah:"kiri" })),
  Watak(Object.assign(tile(18, 17), { id:"gujerat", nama:"Saudagar Gujerat", s:"Sultan2", muka:"Sultan2", nada:230, arah:"bawah" }))
];
NPC.forEach(n => n.rumah = { x:n.x, y:n.y });
const BENDA = [{ id:"gulungan", ...tile(7, 17), ada: () => S.jumpaTok && !S.gulungan }];

/* ---------- Kandungan cerita ---------- */
const ILMU1 = [
  "Link affiliate anda ialah Surat Cap Mohor anda. Sesiapa yang buka link ini, sistem kenal ia datang dari anda.",
  "Link ini terus membuka chatbot. Chatbot terangkan produk, harga, voucher RM20 dan cara daftar.",
  "Anda tak perlu hafal harga. Tugas anda: kongsi link dan ajak orang berbual.",
  "Komisen RM100 setiap produk. Capai 11 jualan dalam sebulan, semua jualan bulan itu jadi RM200."
];
const PESAN1 = "📿 Pesanan Tok Guru: Betulkan niat. Berniaga kerana mahu menyara keluarga dengan rezeki yang halal. Niat yang baik menjadikan penat itu ibadah.";
const NARATIF = [
  "Cahaya terang. Dunia berputar…",
  "Bila {N} membuka mata, bunyi kereta sudah hilang.",
  "Yang ada hanya bunyi ombak, kapal layar dan jeti kayu.",
  "Bandar Melaka. Kurun ke-15."
];
const isi = s => s.replace(/\{N\}/g, NAMA()).replace(/\{P\}/g, PANGGIL());

function misi(){
  let t;
  if(!S.jumpaTok) t = "Cari Tok Malik di gerai rempah";
  else if(!S.gulungan) t = "Ambil Gulungan Ilmu di barat gerai";
  else if(!S.lapor) t = "Kembali kepada Tok Malik";
  else t = "Dapatkan Surat Cap Mohor (Ujian 1)";
  $("mTeks").textContent = t;
  NPC[0].seru = !S.jumpaTok || (S.gulungan && !S.lapor) || !!S.lapor;
}

async function bual(n){
  const A = (t, w) => cakap(n, t, w);
  const AKU = t => cakap(null, t);
  if(n.id === "tok"){
    if(!S.jumpaTok){
      await A("Hah, akhirnya kau sampai juga, {N}.");
      await A("Aku Tok Malik. Sudah empat puluh tahun aku berdagang di pelabuhan ini.");
      await AKU("Tok… saya di mana ni? Tadi saya di tebing sungai…");
      await A("Kau di Melaka. Keris berhulu emas itu hanya memilih orang yang sedang mencari jalan.");
      await A("Kalau mahu pulang ke zamanmu, kau mesti lulus sembilan ujian pedagang.");
      await A("Tapi sebelum ujian pertama, ada sebuah gulungan ilmu tercicir dekat rumpun pokok di barat gerai ini. Pergi ambil.");
      const p = await pilih(["Baik, Tok!", "Ujian apa tu, Tok?"]);
      if(p === 1) await A("Ujian pertama: dapatkan Surat Cap Mohor, tanda kau pedagang yang sah. Di zamanmu, orang panggil ia link affiliate.");
      S.jumpaTok = 1; simpan(); misi(); sfx("seru");
      tunjuk("Ikut tanda ✨ di barat gerai");
    } else if(!S.gulungan){
      await A("Gulungan itu di barat gerai, dekat pokok rendang tepi teluk. Pergilah.");
    } else {
      if(!S.lapor){
        await A("Bagus. Kau sudah baca ilmunya.");
        await A("Ingat pesanku: betulkan niat. Rezeki yang halal itu berkat.");
        S.lapor = 1; simpan(); misi();
      }
      await A("Sekarang, dapatkan Surat Cap Mohor kau. Bila siap, datang jumpa aku semula.");
      const p = await pilih(["⚔️ Buka Ujian Pertama", "Nanti dulu, Tok"]);
      if(p === 0){ sfx("lulus"); await pudar(true); location.href = "/hikayat/"; }
    }
  } else if(n.id === "nelayan"){
    await A(S.jumpaTok ? "Nelayan yang sabar, rezekinya ada. Begitu juga pedagang, {N}." : "Ombak tenang hari ni. Kalau kau cari Tok Malik, dia di gerai bawah kanopi tu, atas jeti ni.");
  } else if(n.id === "budak"){
    await A("{P} pakai baju pelik! {P} datang dari mana?");
    await AKU("Dari… jauh. Sangat jauh.");
    await A("Hehe. Tok Malik suka orang dari jauh. Dia kata orang jauh bawa cerita baru!");
  } else if(n.id === "makcik"){
    await A("Kau orang baru ya? Pasar Besar di hujung jalan timur tu.");
    await A("Tapi pengawal tak benarkan orang luar masuk. Kena jadi pedagang sah dulu.");
  } else if(n.id === "pengawal"){
    await A("Berhenti! Pasar Besar hanya untuk pedagang yang sudah memukul gendang di pasar.");
    await A("Kembali bila kau sudah lulus Ujian Keempat.");
  } else if(n.id === "gujerat"){
    await A("Salam, sahabat. Aku datang dari Gujerat membawa kain sutera.");
    await A("Bila kau sudah jadi pedagang sah, mari berurus niaga dengan aku di jeti ini.");
  }
}

/* ---------- Dialog ---------- */
let dialogBuka = false, langkauTaip = null, sambung = null;
function cakap(n, teks, w){
  return new Promise(async res => {
    dialogBuka = true;
    const D = $("dialog");
    $("dNama").textContent = n ? n.nama : NAMA();
    const m = $("dMuka");
    if(n && n.muka){ m.src = "aset/watak/" + n.muka + "-muka.png"; m.hidden = false; } else m.hidden = true;
    $("dPilih").hidden = true; $("dLagi").hidden = true; D.hidden = false;
    const t = isi(teks); const el = $("dTeks"); el.textContent = "";
    let i = 0, habis = false;
    langkauTaip = () => { habis = true; };
    while(i < t.length && !habis){
      el.textContent = t.slice(0, ++i);
      if(i % 2 === 0 && /\S/.test(t[i - 1])) blip(n ? n.nada : 330);
      await sleep(/[.,!?…]/.test(t[i - 1]) ? 90 : 24);
    }
    el.textContent = t; langkauTaip = null;
    if(w === "tanpaTunggu"){ res(); return; }
    $("dLagi").hidden = false;
    sambung = () => { sambung = null; sfx("gerak", .4); res(); };
  });
}
function pilih(opsyen){
  return new Promise(res => {
    const P = $("dPilih"); P.innerHTML = ""; P.hidden = false; $("dLagi").hidden = true;
    opsyen.forEach((o, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = o;
      b.onclick = e => { e.stopPropagation(); sfx("pilih"); P.hidden = true; res(i); }; P.appendChild(b); });
    setTimeout(() => P.querySelector("button").focus(), 50);
  });
}
function tutupDialog(){ $("dialog").hidden = true; dialogBuka = false; }
$("dialog").addEventListener("pointerdown", e => { e.stopPropagation(); if(langkauTaip) langkauTaip(); else if(sambung) sambung(); });

async function berbual(n){
  if(dialogBuka || sibuk) return;
  sibuk = true; henti();
  // pusing menghadap pemain
  const dx = pemain.x - n.x, dy = pemain.y - n.y;
  n.arah = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "kanan" : "kiri") : (dy > 0 ? "bawah" : "atas");
  n.jalan = 0; n.bual = true; sfx("pilih", .5);
  await bual(n);
  n.bual = false; tutupDialog(); sibuk = false;
}

/* ---------- Gulungan ---------- */
function bukaGulungan(){
  sibuk = true; henti(); sfx("gulungan"); setTimeout(() => sfx("rahsia", .6), 250);
  $("gIlmu").innerHTML = ILMU1.map(x => "<li>" + x + "</li>").join("");
  $("gPesan").textContent = PESAN1;
  $("sGulung").hidden = false;
  $("gTutup").onclick = () => { sfx("syiling"); $("sGulung").hidden = true; S.gulungan = 1; simpan(); misi(); sibuk = false; tunjuk("Gulungan disimpan. Kembali kepada Tok Malik ❗"); };
}

/* ---------- Input ---------- */
const kunci = {};
let vx = 0, vy = 0, sibuk = true, main = false;
const henti = () => { vx = vy = 0; for(const k in kunci) kunci[k] = false; $("kayu").hidden = true; tekan = null; };
addEventListener("keydown", e => {
  if(!main) return;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  if(e.key === " " || e.key === "Enter" || e.key === "z"){ if(dialogBuka){ if(langkauTaip) langkauTaip(); else if(sambung) sambung(); } else tindak(); return; }
  kunci[e.key.toLowerCase()] = true;
});
addEventListener("keyup", e => { kunci[e.key.toLowerCase()] = false; });
let tekan = null;
cv.addEventListener("pointerdown", e => {
  if(!main || sibuk) return;
  bukaAudio();
  if(e.pointerType === "mouse"){
    // klik pada NPC berdekatan = berbual
    const wx = cam.x + e.clientX / SK, wy = cam.y + e.clientY / SK;
    const n = NPC.find(n => Math.hypot(n.x - wx, n.y - 8 - wy) < 14);
    if(n && jarak(n) < 34) berbual(n);
    return;
  }
  tekan = { id:e.pointerId, x:e.clientX, y:e.clientY };
  const k = $("kayu"); k.style.left = e.clientX + "px"; k.style.top = e.clientY + "px"; k.hidden = false; $("kayuI").style.transform = "";
});
addEventListener("pointermove", e => {
  if(!tekan || e.pointerId !== tekan.id) return;
  let dx = e.clientX - tekan.x, dy = e.clientY - tekan.y; const d = Math.hypot(dx, dy), m = 46;
  if(d > m){ dx = dx / d * m; dy = dy / d * m; }
  $("kayuI").style.transform = `translate(${dx}px,${dy}px)`;
  vx = Math.abs(dx) > 8 ? dx / m : 0; vy = Math.abs(dy) > 8 ? dy / m : 0;
});
const lepas = e => { if(tekan && e.pointerId === tekan.id){ tekan = null; vx = vy = 0; $("kayu").hidden = true; } };
addEventListener("pointerup", lepas); addEventListener("pointercancel", lepas);
$("btnA").addEventListener("pointerdown", e => { e.stopPropagation(); bukaAudio(); tindak(); });

const jarak = n => Math.hypot(n.x - pemain.x, n.y - pemain.y);
function dekatSekali(){
  let best = null, bd = 30;
  NPC.forEach(n => { const d = jarak(n); if(d < bd){ bd = d; best = n; } });
  return best;
}
function tindak(){
  if(sibuk || dialogBuka) return;
  const n = dekatSekali(); if(n) berbual(n);
}

/* ---------- Gerak & kemas kini ---------- */
function gerak(w, dx, dy, dt){
  const sp = w.laju * dt;
  const cuba = (nx, ny) => !(pada(nx - 5, ny - 4) || pada(nx + 5, ny - 4) || pada(nx - 5, ny) || pada(nx + 5, ny))
    && !NPC.concat([pemain]).some(o => o !== w && Math.abs(o.x - nx) < 11 && Math.abs(o.y - ny) < 8);
  const nx = w.x + dx * sp, ny = w.y + dy * sp;
  if(dx && cuba(nx, w.y)) w.x = nx;
  if(dy && cuba(w.x, ny)) w.y = ny;
}
let tAnim = 0, tTip = 0;
function kemas(dt){
  tAnim += dt;
  // pemain
  let dx = vx, dy = vy;
  if(kunci["arrowleft"] || kunci["a"]) dx = -1;
  if(kunci["arrowright"] || kunci["d"]) dx = 1;
  if(kunci["arrowup"] || kunci["w"]) dy = -1;
  if(kunci["arrowdown"] || kunci["s"]) dy = 1;
  if(sibuk){ dx = dy = 0; }
  const m = Math.hypot(dx, dy);
  if(m > 0.15){
    if(m > 1){ dx /= m; dy /= m; }
    pemain.arah = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "kanan" : "kiri") : (dy > 0 ? "bawah" : "atas");
    gerak(pemain, dx, dy, dt); pemain.jalan += dt * 8;
  } else pemain.jalan = 0;
  // NPC berkelana
  NPC.forEach(n => {
    if(!n.kelana || n.bual) return;
    n.tunggu = (n.tunggu || 0) - dt;
    if(n.tunggu <= 0){
      if(n.gd){ n.gd = null; n.tunggu = 1 + Math.random() * 2.5; }
      else { const a = [[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random() * 4)]; n.gd = a; n.tunggu = .5 + Math.random() * 1.2;
        n.arah = a[0] > 0 ? "kanan" : a[0] < 0 ? "kiri" : a[1] > 0 ? "bawah" : "atas"; }
    }
    if(n.gd){
      const hx = n.x + n.gd[0] * 4 - n.rumah.x, hy = n.y + n.gd[1] * 4 - n.rumah.y;
      if(Math.hypot(hx, hy) > n.kelana){ n.gd = null; n.tunggu = .8; return; }
      n.laju = 26; gerak(n, n.gd[0], n.gd[1], dt); n.jalan += dt * 6;
    } else n.jalan = 0;
  });
  // benda
  BENDA.forEach(b => { if(b.ada() && !sibuk && Math.hypot(b.x - pemain.x, b.y - pemain.y) < 12) bukaGulungan(); });
  // butang A
  const dekat = !sibuk && dekatSekali();
  $("btnA").classList.toggle("dekat", !!dekat);
  // bunyi ombak ikut jarak ke laut
  if(BUNYI && main) ombak.volume = Math.max(0, Math.min(.5, (pemain.y - 200) / 260));
  if(tTip && (tTip -= dt) <= 0){ tTip = 0; $("tip").style.opacity = 0; setTimeout(() => { if(!tTip) $("tip").hidden = true; }, 400); }
}
function tunjuk(t, s){ const el = $("tip"); el.textContent = t; el.hidden = false; el.style.opacity = 1; tTip = s || 4; }

/* ---------- Lukis ---------- */
const cam = { x:0, y:0 };
function lukisWatak(w){
  const sh = IMG[w.s]; if(!sh) return;
  const fr = w.jalan ? Math.floor(w.jalan) % Math.max(1, Math.floor(sh.height / 16)) : 0;
  const x = Math.round(w.x - 8), y = Math.round(w.y - 16);
  if(IMG.bayang) ctx.drawImage(IMG.bayang, Math.round(w.x - 6), Math.round(w.y - 4));
  ctx.drawImage(sh, ARAH[w.arah] * 16, fr * 16, 16, 16, x, y, 16, 16);
}
function lukis(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0d1022"; ctx.fillRect(0, 0, cv.width, cv.height);
  if(!PETA) return;
  const MW = PETA.w * T, MH = PETA.h * T;
  cam.x = Math.max(0, Math.min(MW - VW, pemain.x - VW / 2));
  cam.y = Math.max(0, Math.min(MH - VH, pemain.y - 8 - VH / 2));
  if(VW > MW) cam.x = (MW - VW) / 2;
  if(VH > MH) cam.y = (MH - VH) / 2;
  const s = SK * DPR;
  ctx.setTransform(s, 0, 0, s, -Math.round(cam.x * s), -Math.round(cam.y * s));
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(IMG.bawah, 0, 0);
  // riak air
  if(IMG.riak) PETA.riak.forEach((r, i) => {
    const f = Math.floor(tAnim * 4 + i * 1.7) % 4;
    ctx.globalAlpha = .8; ctx.drawImage(IMG.riak, f * 16, 0, 16, 16, r[0] * T, r[1] * T, 16, 16); ctx.globalAlpha = 1;
  });
  // bendera di perahu
  if(IMG.bendera){ const f = Math.floor(tAnim * 6) % 4; ctx.drawImage(IMG.bendera, f * 16, 0, 16, 16, 19 * T + 6, 18 * T + 6, 16, 16); }
  // benda bercahaya
  BENDA.forEach(b => {
    if(!b.ada() || !IMG.gulungan) return;
    const bob = Math.sin(tAnim * 3) * 2;
    ctx.globalAlpha = .35 + Math.sin(tAnim * 4) * .2; ctx.fillStyle = "#fff3a8";
    ctx.beginPath(); ctx.arc(b.x, b.y - 6, 10 + Math.sin(tAnim * 4) * 2, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    ctx.drawImage(IMG.gulungan, Math.round(b.x - 7), Math.round(b.y - 14 + bob));
    // kilauan
    for(let k = 0; k < 3; k++){ const a = tAnim * 2 + k * 2.1; ctx.fillStyle = "#fff"; ctx.fillRect(Math.round(b.x + Math.cos(a) * 11), Math.round(b.y - 8 + Math.sin(a * 1.3) * 9), 1, 1); }
  });
  // watak ikut kedudukan y
  NPC.concat([pemain]).sort((a, b) => a.y - b.y).forEach(lukisWatak);
  ctx.drawImage(IMG.atas, 0, 0);
  // tanda seru
  NPC.forEach(n => {
    if(!n.seru || n.bual || !IMG.seru) return;
    const bob = Math.round(Math.sin(tAnim * 5) * 1.5);
    ctx.drawImage(IMG.seru, Math.round(n.x - 7), Math.round(n.y - 31 + bob));
  });
}

/* ---------- Gelung ---------- */
let akhir = performance.now();
function gelung(t){
  const dt = Math.min(.05, (t - akhir) / 1000); akhir = t;
  if(main) kemas(dt);
  lukis();
  requestAnimationFrame(gelung);
}

/* ---------- Peralihan ---------- */
function pudar(masuk){ $("pudar").style.opacity = masuk ? 1 : 0; return sleep(550); }

async function naratif(){
  const N = $("sNaratif"), p = $("nTeks"); N.hidden = false; N.classList.remove("gelap");
  sfx("rahsia", .8);
  for(let i = 0; i < NARATIF.length; i++){
    p.classList.remove("nampak"); await sleep(350);
    p.textContent = isi(NARATIF[i]); p.classList.add("nampak");
    if(i === 1) N.classList.add("gelap");
    await new Promise(r => { const t = setTimeout(r, 2600); N.onpointerdown = () => { clearTimeout(t); r(); }; });
  }
  N.onpointerdown = null; p.classList.remove("nampak"); await sleep(400);
  N.hidden = true;
}

async function mulakan(){
  bukaAudio(); sfx("pilih");
  LS.set("hk_w", WATAK);
  pemain.s = WATAK === "P" ? "OldWoman" : "Villager3";
  $("sJudul").hidden = true;
  if(!S.sampai){ mainLagu(laguJ); await naratif(); S.sampai = 1; simpan(); }
  const mula = S.jumpaTok ? tile(14, 17) : tile(16, 23);
  pemain.x = mula.x; pemain.y = mula.y; pemain.arah = "atas";
  $("hud").hidden = false; $("btnA").hidden = false;
  main = true; misi(); mainLagu(lagu);
  await pudar(false);
  sibuk = false;
  const sentuh = matchMedia("(pointer:coarse)").matches;
  tunjuk(sentuh ? "Seret jari di skrin untuk berjalan. Tekan A untuk berbual." : "Anak panah atau WASD untuk berjalan. Space untuk berbual.", 6);
  if(!sentuh) $("btnA").hidden = true;
}

/* ---------- Skrin judul ---------- */
document.querySelectorAll("[data-w]").forEach(b => {
  if(b.dataset.w === WATAK) b.setAttribute("aria-pressed", "true");
  b.onclick = () => { bukaAudio(); sfx("gerak"); WATAK = b.dataset.w; document.querySelectorAll("[data-w]").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false")); };
});
$("mula").onclick = () => {
  if(!WATAK){ sfx("batal"); $("pilihW").animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"none"}], 250); return; }
  mulakan();
};

/* ---------- Muat aset ---------- */
(async function(){
  $("pudar").style.opacity = 0;
  await Promise.all([
    muat("bawah", "aset/peta-bawah.png"), muat("atas", "aset/peta-atas.png"),
    muat("seru", "aset/seru.png"), muat("gulungan", "aset/gulungan.png"), muat("riak", "aset/riak.png"),
    muat("bendera", "aset/bendera.png"), muat("bayang", "aset/watak/bayang.png"),
    ...WATAKS.map(w => muat(w, "aset/watak/" + w + ".png")),
    fetch("aset/peta.json").then(r => r.json()).then(j => PETA = j)
  ]);
  // pratonton watak di skrin judul
  document.querySelectorAll("canvas[data-s]").forEach(c => { const g = c.getContext("2d"); g.imageSmoothingEnabled = false; if(IMG[c.dataset.s]) g.drawImage(IMG[c.dataset.s], 0, 0, 16, 16, 0, 0, 16, 16); });
  pemain.s = WATAK === "P" ? "OldWoman" : "Villager3";
  const p0 = tile(16, 20); pemain.x = p0.x; pemain.y = p0.y;
  setBunyi(BUNYI);

  requestAnimationFrame(gelung);
})();
})();
</script>
